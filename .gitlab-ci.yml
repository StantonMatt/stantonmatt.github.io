workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

default:
  image: alpine:3.22
  tags:
    - saas-linux-small-amd64
  interruptible: true

.site:
  script:
    - mkdir public
    - cp index.html privacy.html terms.html style.css .nojekyll public/
    - test -s public/index.html && test -s public/privacy.html && test -s public/terms.html && test -s public/style.css

validate:
  extends: .site
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pages:
  extends: .site
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
